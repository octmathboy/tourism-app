<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Tourism Service</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS for Interactive Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        #map { height: 260px; width: 100%; border-radius: 0.5rem; z-index: 1; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-teal-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Add New Tourism Service</h1>
            <p class="text-teal-100 text-sm mt-1">Submit business details and pick exact location on map</p>
        </div>

        <form id="serviceForm" class="p-6 space-y-5">
            
            <!-- Category Selection -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Category / Target Screen:</label>
                <select id="category" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
                    <option value="">-- Select Category --</option>
                    <option value="taxi">Transport / Taxi</option>
                    <option value="hotel">Hotels & Lodging</option>
                    <option value="restaurant">Restaurants & Cafes</option>
                    <option value="guide">Tour Guides</option>
                </select>
            </div>

            <!-- Service Name -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Service / Place Name:</label>
                <input type="text" id="name" placeholder="e.g. Royal Hotel, National Museum" required 
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <!-- Phone Number -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Phone / WhatsApp Number:</label>
                <input type="tel" id="phone" placeholder="e.g. +213661234567" required 
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <!-- Short Address / Description -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Short Address / Description:</label>
                <textarea id="description" rows="3" placeholder="e.g. Main Boulevard, City Center" required 
                          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none"></textarea>
            </div>

            <!-- Photo URLs -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Photo URLs (Comma Separated):</label>
                <textarea id="images" rows="2" placeholder="https://image1.jpg, https://image2.jpg" 
                          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none"></textarea>
            </div>

            <!-- Interactive Map Location Picker -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-semibold text-gray-700">Select Hotel / Business Location on Map:</label>
                    <button type="button" onclick="locateUserDevice()" class="text-xs text-blue-600 hover:underline font-semibold">
                        📍 Center on My Location
                    </button>
                </div>
                <p class="text-xs text-gray-500 mb-2">Click anywhere on the map or drag the red marker to set the exact spot of your business.</p>
                
                <!-- Map Container -->
                <div id="map"></div>

                <!-- Display Selected Coordinates -->
                <div class="mt-2 text-xs text-gray-600 bg-gray-50 p-2 rounded border border-gray-200 flex justify-between">
                    <span><strong>Latitude:</strong> <span id="latDisplay">Click map to set</span></span>
                    <span><strong>Longitude:</strong> <span id="lngDisplay">Click map to set</span></span>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                    class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-3.5 px-4 rounded-lg shadow-md transition-colors">
                💾 Save & Publish Entry
            </button>
        </form>
    </div>

    <script>
        // Firebase Configuration (Replace with your actual Firebase project settings)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Coordinates Storage
        let selectedLat = null;
        let selectedLng = null;

        // Initialize Leaflet Map (Default view: Algeria / North Africa)
        const map = L.map('map').setView([35.6971, -0.6308], 12);

        // Add OpenStreetMap Tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Marker for Business Location
        let marker = null;

        function setCoordinates(lat, lng) {
            selectedLat = lat;
            selectedLng = lng;
            document.getElementById('latDisplay').innerText = lat.toFixed(6);
            document.getElementById('lngDisplay').innerText = lng.toFixed(6);

            if (!marker) {
                marker = L.marker([lat, lng], { draggable: true }).addTo(map);
                marker.on('dragend', function (event) {
                    const position = marker.getLatLng();
                    setCoordinates(position.lat, position.lng);
                });
            } else {
                marker.setLatLng([lat, lng]);
            }
        }

        // Click on map to drop pin
        map.on('click', function (e) {
            setCoordinates(e.latlng.lat, e.latlng.lng);
        });

        // Optional: Center map on current device location
        function locateUserDevice() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.setView([lat, lng], 15);
                    setCoordinates(lat, lng);
                }, () => {
                    alert("Could not access device location. Please move the map manually.");
                });
            }
        }

        // Form Submission Logic
        document.getElementById('serviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (selectedLat === null || selectedLng === null) {
                alert("Please click on the map to set the location of your business!");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Saving entry...";

            const category = document.getElementById('category').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const description = document.getElementById('description').value;
            const rawImages = document.getElementById('images').value;

            const imagesList = rawImages ? rawImages.split(',').map(url => url.trim()).filter(url => url.length > 0) : [];

            try {
                await db.collection('services').add({
                    category: category,
                    name: name,
                    phone: phone,
                    address: description,
                    description: description,
                    lat: selectedLat,
                    lng: selectedLng,
                    images: imagesList,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Service published successfully! It will now appear on the mobile app.");
                document.getElementById('serviceForm').reset();
                
                // Reset map marker
                if (marker) {
                    map.removeLayer(marker);
                    marker = null;
                }
                selectedLat = null;
                selectedLng = null;
                document.getElementById('latDisplay').innerText = "Click map to set";
                document.getElementById('lngDisplay').innerText = "Click map to set";

            } catch (err) {
                console.error("Error adding document: ", err);
                alert("Error saving service: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "💾 Save & Publish Entry";
            }
        });
    </script>
</body>
</html>
