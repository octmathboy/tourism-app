<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Tourism Service</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-teal-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Add New Tourism Service</h1>
            <p class="text-teal-100 text-sm mt-1">Submit place details and acquire GPS position</p>
        </div>

        <form id="serviceForm" class="p-6 space-y-5">
            
            <!-- Category Selection -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Category / Target Screen:</label>
                <select id="category" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
                    <option value="">-- Select Category --</option>
                    <option value="taxi">Transport / Taxi</option>
                    <option value="hotel">Hotels & Lodging</option>
                    <option value="restaurant">Restaurants & Cafes</option>
                    <option value="guide">Tour Guides</option>
                </select>
            </div>

            <!-- Service Name -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Service / Place Name:</label>
                <input type="text" id="name" placeholder="e.g. Royal Hotel, National Museum" required 
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <!-- Phone Number -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Phone / WhatsApp Number:</label>
                <input type="tel" id="phone" placeholder="e.g. +213661234567" required 
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <!-- Short Address / Description -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Short Address / Description:</label>
                <textarea id="description" rows="3" placeholder="e.g. Main Boulevard, City Center" required 
                          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none"></textarea>
            </div>

            <!-- Photo URLs -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Photo URLs (Comma Separated):</label>
                <textarea id="images" rows="2" placeholder="https://image1.jpg, https://image2.jpg" 
                          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none"></textarea>
            </div>

            <!-- GPS Location Detection -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">GPS Location Coordinates:</label>
                <button type="button" id="gpsBtn" onclick="getLocation()" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors">
                    <span>📍</span>
                    <span id="gpsStatus">Detect Current GPS Location</span>
                </button>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                    class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-3.5 px-4 rounded-lg shadow-md transition-colors">
                💾 Save & Publish Entry
            </button>
        </form>
    </div>

    <script>
        // Firebase Configuration (Replace with your actual Firebase project settings)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Coordinates Storage Variables
        let currentLat = null;
        let currentLng = null;

        // Fetch Location via Web Geolocation API
        function getLocation() {
            const statusSpan = document.getElementById('gpsStatus');
            const btn = document.getElementById('gpsBtn');

            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            statusSpan.innerText = "Detecting position...";
            btn.classList.remove('bg-blue-600', 'bg-green-600');
            btn.classList.add('bg-yellow-600');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;

                    statusSpan.innerText = `Location Acquired! (${currentLat.toFixed(4)}, ${currentLng.toFixed(4)})`;
                    btn.classList.remove('bg-yellow-600');
                    btn.classList.add('bg-green-600');
                },
                (error) => {
                    btn.classList.remove('bg-yellow-600');
                    btn.classList.add('bg-blue-600');
                    statusSpan.innerText = "Detect Current GPS Location";
                    
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            alert("Please allow location access in your browser to detect GPS position.");
                            break;
                        case error.POSITION_UNAVAILABLE:
                            alert("Location information is unavailable.");
                            break;
                        case error.TIMEOUT:
                            alert("The request to get user location timed out.");
                            break;
                        default:
                            alert("An unknown error occurred while retrieving location.");
                    }
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Form Submission Logic
        document.getElementById('serviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (currentLat === null || currentLng === null) {
                alert("Please click the 'Detect Current GPS Location' button first!");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Saving entry...";

            const category = document.getElementById('category').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const description = document.getElementById('description').value;
            const rawImages = document.getElementById('images').value;

            // Process image URLs into an array
            const imagesList = rawImages ? rawImages.split(',').map(url => url.trim()).filter(url => url.length > 0) : [];

            try {
                await db.collection('services').add({
                    category: category,
                    name: name,
                    phone: phone,
                    address: description,
                    description: description,
                    lat: currentLat,
                    lng: currentLng,
                    images: imagesList,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Service published successfully! It will now appear on the mobile app.");
                document.getElementById('serviceForm').reset();
                
                // Reset GPS Button State
                currentLat = null;
                currentLng = null;
                const statusSpan = document.getElementById('gpsStatus');
                const btn = document.getElementById('gpsBtn');
                statusSpan.innerText = "Detect Current GPS Location";
                btn.classList.remove('bg-green-600', 'bg-yellow-600');
                btn.classList.add('bg-blue-600');

            } catch (err) {
                console.error("Error adding document: ", err);
                alert("Error saving service: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "💾 Save & Publish Entry";
            }
        });
    </script>
</body>
</html>
